name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.4, 8.3, 8.2]
        laravel: [13.*, 12.*, 11.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 11.*
            testbench: 9.*
        exclude:
          # Laravel 13 and its testbench require PHP 8.3+
          - laravel: 13.*
            php: 8.2

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci

  # The same suite against the engines the workspace compiles SQL differently
  # for. The matrix above runs on SQLite, which never exercises backtick
  # quoting, and whose CTE and temporary-table behaviour is its own.
  #
  # One PHP and Laravel version each: this leg is about the database, and the
  # matrix above already covers the language.
  databases:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: mysql
            image: mysql:8.4
            port: 3306
            username: root
            health: --health-cmd="mysqladmin ping --silent --user=root --password=panorama" --health-interval=10s --health-timeout=5s --health-retries=10
          - engine: pgsql
            image: postgres:16
            port: 5432
            username: postgres
            health: --health-cmd="pg_isready --username=postgres" --health-interval=10s --health-timeout=5s --health-retries=10

    name: ${{ matrix.engine }} - P8.3

    services:
      database:
        image: ${{ matrix.image }}
        env:
          # Each image reads the pair it knows and ignores the other.
          MYSQL_ROOT_PASSWORD: panorama
          MYSQL_DATABASE: panorama
          POSTGRES_PASSWORD: panorama
          POSTGRES_DB: panorama
        ports:
          - ${{ matrix.port }}:${{ matrix.port }}
        options: ${{ matrix.health }}

    env:
      PANORAMA_DB: ${{ matrix.engine }}
      PANORAMA_DB_HOST: 127.0.0.1
      PANORAMA_DB_PORT: ${{ matrix.port }}
      PANORAMA_DB_DATABASE: panorama
      PANORAMA_DB_USERNAME: ${{ matrix.username }}
      PANORAMA_DB_PASSWORD: panorama

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, pdo_mysql, pdo_pgsql, bcmath, intl, fileinfo
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-stable --prefer-dist --no-interaction

      - name: Execute tests
        run: vendor/bin/pest --ci
